<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171b2b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>X Vault · 私人内容归档</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#0c1020;color:#e8eafb;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:770px;margin:0 auto;padding:42px 20px}h1{font-size:32px;margin:0 0 8px}p{color:#b8bfd4;line-height:1.6}header{padding-bottom:22px;border-bottom:1px solid #323a55}input,button{font:inherit;border-radius:10px;border:1px solid #444c69;padding:13px 15px}input{background:#171d34;color:white;width:100%}button{background:#6d79ff;border:0;color:white;font-weight:650;cursor:pointer}button.secondary{background:#27304d}label{font-size:14px;color:#bdc6e1;display:block;margin-bottom:8px}section{margin:26px 0}.flex{display:flex;gap:9px}.flex input{flex:1}.item{background:#171d34;border:1px solid #303a59;border-radius:14px;padding:18px;margin:11px 0}.top{display:flex;justify-content:space-between;gap:12px}.meta{font-size:12px;color:#a3afd0}.pill{font-size:12px;color:#bdc7ff;background:#2a3360;padding:4px 8px;border-radius:20px;white-space:nowrap}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.actions button,.actions a{font-size:13px;padding:7px 11px;border-radius:8px}.actions a{color:#d2d7ff;border:1px solid #43517e;text-decoration:none}.danger{color:#ffb4b4}.muted{color:#8391b2}.foot{font-size:13px;margin-top:35px}#message{min-height:28px;color:#a3ffce;white-space:pre-wrap}#tokenWrap{display:none}small{color:#aab2ce}@media(max-width:500px){main{padding:25px 14px}.flex{flex-direction:column}h1{font-size:27px}}
</style></head><body><main><header><h1>◈ X Vault</h1><p>把感兴趣的 X 帖子、长帖串、图片和最高可获取画质视频，保存成自己的文件。可选同步到 Notion。</p></header>
<section id="tokenWrap"><label>你的个人 API Token（只保留在本机浏览器）</label><div class="flex"><input type="password" id="token" autocomplete="off" placeholder="粘贴 .env 文件中的 APP_TOKEN"><button id="saveToken">保存 Token</button></div></section>
<section><label>X 帖子链接</label><form id="saveForm" class="flex"><input id="url" type="url" required placeholder="https://x.com/用户名/status/123..." spellcheck="false"><button>解析并收藏</button></form><div id="message"></div><div id="videoChoice" class="item" hidden><strong>检测到视频，选择保存方式</strong><p id="videoSummary"></p><div class="actions"><button id="saveNotion" type="button">保存到 Notion</button><button id="saveLocal" type="button" class="secondary">下载视频到本机</button></div><p class="meta">下载到本机：服务器只作临时中转，传输完立即删除。单视频下载 MP4/WebM，多视频下载 ZIP。保存到 Notion：受 Notion 账户单文件上传限制，完成后服务器同样不保留视频。</p></div></section>
<section><div class="top"><h2 style="font-size:19px;margin:0">收藏记录</h2><button class="secondary" id="refresh">刷新</button></div><div id="items"><p class="muted">输入 Token 后读取列表。</p></div></section>
<p class="foot">下载文件始终优先保存在你自己的服务器。视频改为按需下载或上传 Notion，不长期留存在服务器。Notion 免费空间的视频可能受单文件 5 MiB 限制。Thread 完整性取决于内容来源接口。</p></main>
<script>
const $=id=>document.getElementById(id), tokenKey='xvault_token';
function token(){return localStorage.getItem(tokenKey)||''}
function showAuth(){ $('tokenWrap').style.display=token()?'none':'block' }
async function api(url,options={}){const r=await fetch(url,{...options,headers:{Authorization:'Bearer '+token(),...(options.headers||{})}});let data;try{data=await r.json()}catch{data={detail:'服务器响应异常'}}if(!r.ok)throw new Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
$('saveToken').onclick=()=>{let t=$('token').value.trim();if(t){localStorage.setItem(tokenKey,t);$('token').value='';showAuth();load();autoSaveShare()}};
$('refresh').onclick=load;
let pendingVideoUrl='';
async function submitSave(url,destination){return await api('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,destination})})}
let shareAutoStarted=false, sharedPostUrl='';
async function parseAndArchive(){ $('videoChoice').hidden=true;pendingVideoUrl='';$('message').textContent='正在自动解析帖子…';try{const url=$('url').value.trim();const r=await submitSave(url,null);if(r.status==='needs_choice'){pendingVideoUrl=url;let p=r.preview;$('videoSummary').textContent=(p.author?'@'+p.author+' · ':'')+(p.text_preview||'')+'\n发现 '+p.video_count+' 个视频，涉及 '+p.post_count+' 条帖子。';$('videoChoice').hidden=false;$('message').textContent='发现视频，请选择保存方式：';return}$('message').textContent=r.new?'已自动收藏图文帖子。':'这条帖子已经在收藏库中。';$('url').value='';load()}catch(err){$('message').textContent=err.message;if(err.message.includes('Token'))$('tokenWrap').style.display='block'}}
$('saveForm').onsubmit=async e=>{e.preventDefault();await parseAndArchive()};
function autoSaveShare(){if(!sharedPostUrl||shareAutoStarted)return;if(!token()){$('message').textContent='已接收分享链接。首次使用请保存 API Token，保存后会自动解析。';showAuth();return}shareAutoStarted=true;parseAndArchive()}
async function chooseVideo(destination){if(!pendingVideoUrl)return;for(let id of ['saveNotion','saveLocal'])$(id).disabled=true;$('message').textContent=destination==='local'?'正在准备安全下载链接…':'正在提交到 Notion 归档队列…';try{const r=await submitSave(pendingVideoUrl,destination);if(destination==='local'){if(r.status!=='download_ready')throw new Error('无法取得下载链接');$('message').textContent='视频准备中，下载会在解析及临时转码后开始；请勿提前关闭下载页面。';window.location.assign(r.download_url)}else{$('message').textContent=r.new?'已加入 Notion 上传队列（不长期占用服务器空间）。':'已有这条 Notion 归档。';$('videoChoice').hidden=true;pendingVideoUrl='';$('url').value='';load()}}catch(err){$('message').textContent=err.message}finally{for(let id of ['saveNotion','saveLocal'])$(id).disabled=false}}
$('saveNotion').onclick=()=>chooseVideo('notion');
$('saveLocal').onclick=()=>chooseVideo('local');
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function load(){if(!token()){showAuth();return}try{const data=await api('/api/archives');let host=$('items');host.replaceChildren();if(!data.items.length){host.append(el('p','还没有收藏，先添加一条 X 链接。'));return}for(const it of data.items){let card=el('div',undefined,'item'), top=el('div',undefined,'top'), left=el('div'), st=el('span',it.status,'pill');left.append(el('strong','X 帖子 '+it.tweet_id+(it.delivery==='notion_video'?' · Notion 视频':'')));left.append(el('div',new Date(it.created_at*1000).toLocaleString(),'meta'));top.append(left,st);card.append(top);if(it.error)card.append(el('p',it.error,'danger'));if(it.warnings?.length)card.append(el('p',it.warnings.slice(0,2).join('；'),'meta'));let acts=el('div',undefined,'actions');const a=(text,href)=>{const x=el('a',text);x.href=href;x.target='_blank';x.rel='noopener';acts.append(x)};a('X 原帖',it.original_url);if(it.notion_url)a('Notion 页面',it.notion_url);let button=el('button','查看详情','secondary');button.onclick=()=>showDetail(it.tweet_id,card);acts.append(button);if(['partial','failed','complete'].includes(it.status)&&!(it.delivery==='notion_video'&&it.notion_url)){let retry=el('button','重试','secondary');retry.onclick=async()=>{await api('/api/retry/'+it.tweet_id,{method:'POST'});load()};acts.append(retry)}card.append(acts);host.append(card)}}catch(e){$('items').replaceChildren(el('p',e.message,'danger'));$('tokenWrap').style.display='block'}}
async function showDetail(id,card){let existing=card.querySelector('.detail');if(existing){existing.remove();return}let d=el('div',undefined,'detail');d.style.marginTop='12px';try{const obj=await api('/api/archives/'+id);if(!obj.archive){d.append(el('p','任务还在处理中'));card.append(d);return}for(const p of obj.archive.posts){d.append(el('p',(p.author_username?'@'+p.author_username+'：':'')+p.text));for(const m of p.media){if(m.notion_stored){d.append(el('p','媒体已上传 Notion：'+m.kind,'meta'))}else if(m.file){let btn=el('button','下载 '+m.file,'secondary');btn.onclick=async()=>{try{const item=await api('/api/media-link/'+id+'/'+encodeURIComponent(m.file.split('/').pop()));const a=document.createElement('a');a.href=item.url;a.download=m.file.split('/').pop();a.rel='noreferrer';document.body.append(a);a.click();a.remove()}catch(e){alert(e.message)}};d.append(btn)}else d.append(el('p','媒体下载失败：'+m.kind,'danger'))}}}catch(e){d.append(el('p',e.message,'danger'))}card.append(d)}
const qp=new URLSearchParams(location.search),shared=qp.get('url')||qp.get('text')||'';
if(shared){const m=shared.match(/https?:\/\/(?:www\.|mobile\.)?(?:x\.com|twitter\.com)\/[^\s/?#]+\/status\/\d+(?:\/[^\s]*)?(?:\?[^\s]*)?/i);if(m){sharedPostUrl=m[0].replace(/[，。！!；;,.)\]}]+$/g,'');$('url').value=sharedPostUrl;const clean=new URL(location.href);clean.searchParams.delete('url');clean.searchParams.delete('text');history.replaceState(null,'',clean.pathname+clean.search+clean.hash)}else{$('message').textContent='分享内容里没有识别到 X 帖子链接，请检查分享来源。'}}
showAuth();load();autoSaveShare();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
